[package]
name = "charybdis-battery"
version = "0.1.0"
edition = "2024"
description = "Cross-platform system tray battery monitor and low-battery notifier for Charybdis Mini RMK"

[dependencies]

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false }
notify-rust = "4.11"
tray-icon = "0.19"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
